- **发布时间**：12-14点 或 19-22点

        };

        const titles = {
            article: '微信公众号文章',
            xhs: '小红书文案',
            weibo: '微博文案',
            moments: '朋友圈文案'
        };

        let currentTab = 'article';

        function switchTab(tabId) {
            currentTab = tabId;
            
            // Update Navigation UI
            document.querySelectorAll('.clay-btn').forEach(btn => {
                if (btn.id === `btn-${tabId}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Render Content
            const markdownText = contentData[tabId];
            const contentArea = document.getElementById('content-area');
            const guideArea = document.getElementById('guide-area');
            
            let htmlContent = '';
            
            if (tabId === 'xhs') {
                htmlContent = `<div class="preview-xhs markdown-body">${marked.parse(markdownText)}</div>`;
            } else if (tabId === 'moments') {
                htmlContent = `<div class="preview-moments"><div class="content-bubble markdown-body">${marked.parse(markdownText)}</div></div>`;
            } else if (tabId === 'weibo') {
                htmlContent = `<div class="preview-weibo markdown-body mx-auto max-w-xl">${marked.parse(markdownText)}</div>`;
            } else {
                htmlContent = `<div class="markdown-body px-4 md:px-12">${marked.parse(markdownText)}</div>`;
            }

            contentArea.innerHTML = htmlContent;
            
            // Render Guide
            guideArea.innerHTML = marked.parse(guideData[tabId]);
        }

        function copyContent() {
            const text = contentData[currentTab];
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('-translate-y-40', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-40', 'opacity-0');
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('article');
        });
    </script>
