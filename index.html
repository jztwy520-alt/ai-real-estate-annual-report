
<!DOCTYPE html>

    <title>AI Real Estate Annual Report 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-color: #EEF2FF;
            --clay-shadow: 
                8px 8px 16px rgba(165, 177, 194, 0.4), 
                -8px -8px 16px rgba(255, 255, 255, 0.8);
            --clay-shadow-hover: 
                12px 12px 20px rgba(165, 177, 194, 0.5), 
                -12px -12px 20px rgba(255, 255, 255, 0.9);
            --clay-shadow-inset: 
                inset 6px 6px 12px rgba(165, 177, 194, 0.2), 
                inset -6px -6px 12px rgba(255, 255, 255, 0.9);
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(253, 188, 180, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(173, 216, 230, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(152, 255, 152, 0.2) 0%, transparent 60%);
            color: #1E1B4B;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 0.02em;
        }
        
        /* Clay Card */
        
        .clay-card {
            background: #F3F6FD;
            border-radius: 24px;
            box-shadow: var(--clay-shadow);
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .clay-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--clay-shadow-hover);
        }
        
        /* 3D Button */
        
        .clay-btn {
            background: #4F46E5;
            color: white;
            border-radius: 16px;
            box-shadow: 
                0 6px 0 #3730A3, 
                0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        
        .clay-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #3730A3, 
                0 0 0 rgba(0,0,0,0.2);
        }
        
        /* Floating Animation */
        
        @keyframes float-clay {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        .float-animation {
            animation: float-clay 6s ease-in-out infinite;
        }
        
        /* Scrollbar */
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #EEF2FF;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
        
        .page-transition-enter {
            opacity: 0;
            transform: scale(0.98) translateY(10px);
        }
        
        .page-transition-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 400ms, transform 400ms;
        }
    </style>
