
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real Estate Annual Report 2024</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-color: #020617;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --secondary-glow: rgba(6, 182, 212, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* Futuristic Background Grid */
        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6), 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .cyan-glow-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6), 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Scanning Line Animation */
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.2), transparent);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* Pulse and Float Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .float-animation { animation: float 6s ease-in-out infinite; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(20px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
        }
        
        .tech-border {
            position: relative;
        }
        .tech-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 15px; height: 15px;
            border-top: 2px solid #06b6d4;
            border-left: 2px solid #06b6d4;
        }
        .tech-border::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px;
            width: 15px; height: 15px;
            border-bottom: 2px solid #a855f7;
            border-right: 2px solid #a855f7;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        
        .page-transition-enter {
            opacity: 0;
            transform: scale(0.98) translateY(10px);
        }
        .page-transition-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 400ms, transform 400ms;
        }
    </style>
